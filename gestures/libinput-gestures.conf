# Optional X11 touchpad gestures for Qtile-Con.
# Install libinput-gestures and xdotool, then copy this file to
# ~/.config/libinput-gestures.conf and run: libinput-gestures-setup restart
# Gestures send the matching Super+Alt keybindings configured in qtile_config/keys.py.
# Three-finger swipes: workspace left/right; layout up/down.
# Four-finger swipes: fullscreen up; floating toggle down; launcher left/right.
gesture swipe left 3 xdotool key --clearmodifiers super+alt+Left
gesture swipe right 3 xdotool key --clearmodifiers super+alt+Right
gesture swipe up 3 xdotool key --clearmodifiers super+alt+Up
gesture swipe down 3 xdotool key --clearmodifiers super+alt+Down
gesture swipe left 4 xdotool key --clearmodifiers super+alt+Return
gesture swipe right 4 xdotool key --clearmodifiers super+alt+shift+Return
gesture swipe up 4 xdotool key --clearmodifiers super+alt+f
gesture swipe down 4 xdotool key --clearmodifiers super+alt+space
