# Touchpad gestures for Qtile-Con (libinput-gestures compatible)
# Copy this file to ~/.config/libinput-gestures.conf
# Note: xdotool recognizes Alt as 'alt' (not 'mod1').
#
# Three-finger swipes: workspace navigation (natural scrolling) and layout cycling.
gesture swipe left 3 xdotool key --clearmodifiers super+alt+Right
gesture swipe right 3 xdotool key --clearmodifiers super+alt+Left
gesture swipe up 3 xdotool key --clearmodifiers super+alt+Up
gesture swipe down 3 xdotool key --clearmodifiers super+alt+Down

# Four-finger swipes: move active window across workspaces; open launcher & terminal.
gesture swipe left 4 xdotool key --clearmodifiers super+alt+shift+Right
gesture swipe right 4 xdotool key --clearmodifiers super+alt+shift+Left
gesture swipe up 4 xdotool key --clearmodifiers super+alt+Return
gesture swipe down 4 xdotool key --clearmodifiers super+alt+shift+Return

# Pinch gestures: pinch in (contract to floating), pinch out (expand to fullscreen).
gesture pinch in 3 xdotool key --clearmodifiers super+alt+space
gesture pinch out 3 xdotool key --clearmodifiers super+alt+f
gesture pinch in 4 xdotool key --clearmodifiers super+alt+space
gesture pinch out 4 xdotool key --clearmodifiers super+alt+f

